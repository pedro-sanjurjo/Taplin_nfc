<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B222C;--tx:#F2F1EC;--ac:#6C8B99;--on:#1B222C;--line:rgba(242,241,236,.14)}
*{box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:30px 18px 120px}
h1{font-size:30px;line-height:1.1;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600;margin:0 0 4px}
.meta{color:color-mix(in srgb,var(--tx) 62%,var(--bg));font-size:13px}
nav{position:sticky;top:0;z-index:3;background:var(--bg);margin:18px -18px 0;padding:10px 18px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--tx);text-decoration:none;border:1.5px solid var(--ac);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
section{scroll-margin-top:64px;margin-top:28px}
.it{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--line)}
.nm{font-weight:500}
.ds{color:color-mix(in srgb,var(--tx) 72%,var(--bg));font-size:14px;margin-top:2px}
.pr{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.it.off{opacity:.5}
.it.off .pr{font-weight:500;font-size:13px;color:color-mix(in srgb,var(--tx) 62%,var(--bg));padding-top:2px}
.msg{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.msg p{color:color-mix(in srgb,var(--tx) 62%,var(--bg));max-width:320px;margin:0 auto}
.rv{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.rv a{display:block;max-width:524px;margin:0 auto;text-align:center;background:var(--ac);color:var(--on);border-radius:12px;padding:14px;font-weight:600;text-decoration:none}
.ex{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.msg .ex{justify-content:center}
.qb{font:inherit;color:var(--tx);background:transparent;border:1.5px solid var(--ac);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;text-decoration:none;cursor:pointer}
.wf{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;text-align:left}
.lg{display:block;max-height:64px;max-width:200px;object-fit:contain;margin:0 0 14px}
.msg .lg{margin:0 auto 14px}
.bt{display:block;text-align:center;background:var(--ac);color:var(--on);border-radius:12px;padding:15px;font-weight:600;text-decoration:none}
.bt.sec{background:transparent;color:var(--tx);border:1.5px solid var(--ac)}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
</style>
</head>
<body>
<div id="app"><div class="msg"><p>Cargando menú…</p></div></div>
<script>
const BASE = 'https://vlghmumguheahejycksl.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsZ2htdW1ndWhlYWhlanlja3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MDE0MzgsImV4cCI6MjEwODQ3NzQzOH0.PDXgCOPCuKvHAZQzlU3vXmvLJOD8uc9AFx52_0Y3edA';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS', maximumFractionDigits:0}).format(n);
const msg = (t, p) => { $('#app').innerHTML = `<div class="msg"><div><h1>${esc(t)}</h1><p>${esc(p)}</p></div></div>`; };
function lum(h){const c=[1,3,5].map(i=>{const v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
function aplicarTema(l){
  const claro=l.tema==='claro', bg=claro?'#FAF8F4':'#1B222C', tx=claro?'#1B222C':'#F2F1EC';
  let ac=/^#[0-9a-fA-F]{6}$/.test(l.color_acento||'')?l.color_acento:null;
  if(!ac||ratio(ac,bg)<3) ac=tx;                 // si el acento no se distingue del fondo, usamos el color del texto
  const on=ratio(ac,'#000000')>=ratio(ac,'#FFFFFF')?'#000000':'#FFFFFF';
  const r=document.documentElement.style;
  r.setProperty('--bg',bg);r.setProperty('--tx',tx);r.setProperty('--ac',ac);r.setProperty('--on',on);
  r.setProperty('--line',claro?'rgba(27,34,44,.14)':'rgba(242,241,236,.14)');
  document.body.style.background=bg;
}
const logoHtml=l=>/^https:\/\//.test(l.logo_url||'')?`<img class="lg" src="${esc(l.logo_url)}" alt="${esc(l.nombre)}">`:'';
const CTX = {};
function track(tipo){
  if (!CTX.id) return;
  try { fetch(`${BASE}/rest/v1/eventos`, {method:'POST', keepalive:true,
    headers:{apikey:KEY, Authorization:'Bearer ' + KEY, 'Content-Type':'application/json', Prefer:'return=minimal'},
    body: JSON.stringify({local_id:CTX.id, mesa:CTX.mesa || null, tipo})}); } catch (e) {}
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-ev]'); if (!t) return;
  track(t.dataset.ev);
  if (t.dataset.copy) { try { navigator.clipboard.writeText(t.dataset.copy); t.textContent = 'Clave copiada'; } catch (_) {} }
});
function extrasHtml(l){
  const wa = String(l.whatsapp || '').replace(/\D/g, '');
  const ig = ((String(l.instagram || '').match(/[A-Za-z0-9._]+\/?$/) || [''])[0]).replace('/', '');
  const dir = (l.direccion || '').trim(), b = [];
  if (wa) b.push(`<a class="qb" data-ev="whatsapp" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>`);
  if (ig) b.push(`<a class="qb" data-ev="instagram" href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">Instagram</a>`);
  if (dir) b.push(`<a class="qb" data-ev="mapa" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}" target="_blank" rel="noopener">Cómo llegar</a>`);
  const w = l.wifi_nombre ? `<div class="wf"><div><div class="meta">Wi-Fi</div><div class="nm">${esc(l.wifi_nombre)}</div>${l.wifi_clave ? `<div class="ds">Clave: ${esc(l.wifi_clave)}</div>` : ''}</div>${l.wifi_clave ? `<button class="qb" data-ev="wifi" data-copy="${esc(l.wifi_clave)}">Copiar clave</button>` : ''}</div>` : '';
  return (b.length ? `<div class="ex">${b.join('')}</div>` : '') + w;
}
async function q(path){
  const r = await fetch(`${BASE}/rest/v1/${path}`, {headers:{apikey:KEY, Authorization:'Bearer ' + KEY}});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

(async () => {
  try {
    // /t/<codigo> = tarjeta de una mesa · /m/<slug> = link directo al menú
    // Para probar sin redirecciones: cliente.html?t=<codigo> o cliente.html?m=<slug>
    const sp = new URLSearchParams(location.search), parts = location.pathname.split('/').filter(Boolean);
    let kind = parts[0], key = decodeURIComponent(parts[1] || '');
    if (sp.get('t')) { kind = 't'; key = sp.get('t'); }
    else if (sp.get('m')) { kind = 'm'; key = sp.get('m'); }
    if (!['t', 'm'].includes(kind) || !key) return msg('Link no válido', 'Escaneá la tarjeta de nuevo o pedile el link al local.');

    const cols = 'id,nombre,google_review_url,modulo_menu,modulo_resenas,menu_actualizado_en,menu_externo_url,logo_url,tema,color_acento,whatsapp,instagram,direccion,wifi_nombre,wifi_clave';
    let mesa = null, local;
    if (kind === 't') {
      const [t] = await q(`tarjetas?codigo=eq.${encodeURIComponent(key)}&select=mesa,local_id`);
      if (!t || !t.local_id) return msg('Tarjeta sin activar', 'Esta tarjeta todavía no está asociada a un local.');
      mesa = t.mesa;
      [local] = await q(`locales?id=eq.${t.local_id}&select=${cols}`);
    } else {
      [local] = await q(`locales?slug=eq.${encodeURIComponent(key)}&select=${cols}`);
    }
    if (!local) return msg('Local no encontrado', 'Revisá el link o escaneá la tarjeta de nuevo.');

    aplicarTema(local);
    CTX.id = local.id; CTX.mesa = mesa;
    let visto = ''; try { visto = sessionStorage.getItem('sc_' + local.id); } catch (_) {}
    if (!visto) { track('escaneo'); try { sessionStorage.setItem('sc_' + local.id, '1'); } catch (_) {} }
    const rv = /^https:\/\//.test(local.google_review_url || '') && local.modulo_resenas !== false ? local.google_review_url : null;
    const ext = /^https:\/\//.test(local.menu_externo_url || '') ? local.menu_externo_url : null;
    if (ext) {                                       // local con menú propio: solo dos botones
      document.title = local.nombre;
      $('#app').innerHTML = `<div class="msg"><div style="width:100%;max-width:360px;display:grid;gap:12px">
        ${logoHtml(local)}<h1>${esc(local.nombre)}</h1>
        ${mesa ? `<div class="meta">Mesa ${esc(mesa)}</div>` : ''}
        <a class="bt" href="${esc(ext)}" target="_blank" rel="noopener" style="margin-top:12px">Ver menú</a>
        ${rv ? `<a class="bt sec" data-ev="resena" href="${esc(rv)}" target="_blank" rel="noopener">Dejá tu reseña en Google</a>` : ''}
        ${extrasHtml(local)}
      </div></div>`;
      return;
    }
    if (!local.modulo_menu) {                       // local que solo contrató reseñas: va directo a Google
      if (rv) { location.replace(rv); return; }
      return msg(local.nombre, 'El menú todavía no está disponible.');
    }

    const [cats, prods] = await Promise.all([
      q(`categorias?local_id=eq.${local.id}&select=id,nombre&order=orden,nombre`),
      q(`productos?local_id=eq.${local.id}&select=id,categoria_id,nombre,descripcion,precio,disponible&order=orden,nombre`)
    ]);
    const secs = cats.map(c => ({c, ps: prods.filter(p => p.categoria_id === c.id)})).filter(x => x.ps.length);
    const fecha = local.menu_actualizado_en ? new Date(local.menu_actualizado_en).toLocaleDateString('es-AR', {day:'numeric', month:'long'}) : null;
    document.title = local.nombre + ' · Menú';

    $('#app').innerHTML = `<div class="wrap">
      <header>${logoHtml(local)}<h1>${esc(local.nombre)}</h1>
        ${mesa ? `<div class="meta">Mesa ${esc(mesa)}</div>` : ''}
        ${fecha ? `<div class="meta">Precios actualizados el ${fecha}</div>` : ''}</header>
      ${extrasHtml(local)}
      ${secs.length > 1 ? `<nav>${secs.map(({c}) => `<a href="#c-${c.id}">${esc(c.nombre)}</a>`).join('')}</nav>` : ''}
      ${secs.map(({c, ps}) => `<section id="c-${c.id}"><h2>${esc(c.nombre)}</h2>
        ${ps.map(p => `<div class="it${p.disponible ? '' : ' off'}"><div><div class="nm">${esc(p.nombre)}</div>${p.descripcion ? `<div class="ds">${esc(p.descripcion)}</div>` : ''}</div><div class="pr">${p.disponible ? money(p.precio) : 'Agotado'}</div></div>`).join('')}
      </section>`).join('') || '<p class="meta" style="margin-top:24px">El menú todavía está vacío.</p>'}
      <p class="meta" style="text-align:center;margin-top:36px">Menú digital por Taplink</p></div>
      ${rv ? `<div class="rv"><a data-ev="resena" href="${esc(rv)}" target="_blank" rel="noopener">Dejá tu reseña en Google</a></div>` : ''}`;
  } catch (e) {
    msg('No pudimos cargar el menú', 'Revisá tu conexión e intentá de nuevo.');
  }
})();
</script>
</body>
</html>
